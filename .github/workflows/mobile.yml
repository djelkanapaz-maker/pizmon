name: Mobile apps

# Push to main (mobile/**): an installable Android debug APK + an iOS compile check.
# Run manually (Actions → Mobile apps → Run workflow): store builds.
#   - Android: a signed .aab for Google Play (uploaded to Play's internal track when PLAY_SERVICE_ACCOUNT_JSON is set)
#   - iOS: archived, signed and uploaded straight to App Store Connect / TestFlight
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in the stores (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      platforms:
        description: 'Which store builds'
        type: choice
        options: [both, ios, android]
        default: both

jobs:
  android:
    name: Android (installable debug APK)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: paskol-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS (simulator build check)
    if: github.event_name == 'push'
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx cap sync ios
      - shell: bash
        run: set -o pipefail && xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -40

  android-release:
    name: Android (signed bundle for Google Play)
    if: github.event_name == 'workflow_dispatch' && inputs.platforms != 'ios'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: mobile } }
    env: { HAS_PLAY_KEY: "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Upload key and Firebase config from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret first"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; else echo "::warning::No GOOGLE_SERVICES_JSON: push notifications won't work on Android"; fi
      - name: Build signed .aab
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version }}
        run: chmod +x android/gradlew && cd android && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: paskol-google-play-bundle
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.paskol
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios-release:
    name: iOS (signed build to App Store Connect)
    if: github.event_name == 'workflow_dispatch' && inputs.platforms != 'android'
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    env:
      KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx cap sync ios
      - name: App Store Connect API key
        env: { KEY_P8: '${{ secrets.APPSTORE_API_KEY_P8 }}' }
        run: |
          test -n "$KEY_P8" && test -n "$KEY_ID" && test -n "$ISSUER_ID" && test -n "$TEAM_ID" || { echo "::error::Add the APPSTORE_API_KEY_P8, APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID and APPLE_TEAM_ID secrets first"; exit 1; }
          echo "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      # The archive is built unsigned: automatic signing at archive time wants a development
      # profile, which needs a registered device. The export step below signs it for the
      # App Store (cloud-managed distribution signing through the API key), which needs none.
      - name: Archive (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Paskol.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -60
      - name: Carry the entitlements (push) into the archive
        shell: bash
        run: |
          APP="$RUNNER_TEMP/Paskol.xcarchive/Products/Applications/App.app"
          test -d "$APP" || { echo "::error::App.app missing from the archive"; ls -R "$RUNNER_TEMP/Paskol.xcarchive" | head -40; exit 1; }
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \; 2>/dev/null || true
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$APP"
          codesign -d --entitlements - "$APP"
      - name: Export and upload to App Store Connect
        shell: bash
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Paskol.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -40
