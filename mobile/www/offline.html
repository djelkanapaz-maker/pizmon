<!doctype html>
<html lang="he" dir="rtl">
<head>

<title>פסקול</title>
<style>

  h1{margin:0;font-size:26px;font-weight:900;text-shadow:-3px 3px 0 #D7C3A6}
  p{margin:0;color:#6f6457;max-width:320px;line-height:1.5}

<main>
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#1F1F1F"/><circle cx="50" cy="50" r="38" fill="none" stroke="#D7C3A6" stroke-opacity=".35"/><circle cx="50" cy="50" r="28" fill="none" stroke="#D7C3A6" stroke-opacity=".35"/><circle cx="50" cy="50" r="15" fill="#D7C3A6"/><circle cx="50" cy="50" r="3" fill="#1F1F1F"/></svg>
  <h1>אין חיבור לאינטרנט</h1>

  <p class="en">You're offline. Check your connection and try again.</p>
  <button type="button" onclick="location.href='https://www.paskol.app/'">נסו שוב · Retry</button>
